name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

      # Timings go to the job summary and a CSV artifact for comparing runs.
      # Shared runners are noisy, so only wrong results fail the step.
      - name: Benchmark
        shell: bash
        run: |
          bin=build/uae_cpu_bench
          [ -x "$bin" ] || bin=build/Release/uae_cpu_bench.exe
          {
            echo "### Benchmark (${{ matrix.os }})"
            echo '```'
            "$bin" --csv bench-${{ matrix.os }}.csv || touch bench-failed
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test ! -e bench-failed

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.csv

      - name: Test CMake Install
        run: cmake --install build --config Release --prefix install_test

  isolated-symbols:
    name: Isolated symbols, no Musashi API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_TESTS=ON
          -DUAE_CPU_MUSASHI_API=OFF
          -DUAE_CPU_ISOLATE_SYMBOLS=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

  no-jit:
    name: Interpreter only, UAE_CPU_JIT=OFF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_TESTS=ON
          -DUAE_CPU_JIT=OFF

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure
