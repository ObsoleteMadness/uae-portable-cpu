name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate SemVer Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${VERSION} for tag ${TAG}"

  build-artifacts:
    name: Build Package (${{ matrix.os }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: uae-portable-cpu-${{ needs.validate-tag.outputs.tag }}-linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: uae-portable-cpu-${{ needs.validate-tag.outputs.tag }}-macos
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: uae-portable-cpu-${{ needs.validate-tag.outputs.tag }}-windows-x64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_TESTS=ON

      - name: Build & Run Tests
        run: |
          cmake --build build --config Release -j
          ctest --test-dir build -C Release --output-on-failure

      - name: Install to staging directory
        run: cmake --install build --config Release --prefix staging

      - name: Package archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C staging .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path staging\* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  create-release:
    name: Publish GitHub & vcpkg Release
    needs: [ validate-tag, build-artifacts ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums & Release Notes
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          sha512sum * > SHA512SUMS.txt
          cd ..
          
          # Compute source archive SHA512 for vcpkg port
          SRC_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ needs.validate-tag.outputs.tag }}.tar.gz"
          echo "Source Archive URL: ${SRC_URL}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ needs.validate-tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*
          body: |
            ## UAE Portable 680x0 CPU Core ${{ needs.validate-tag.outputs.tag }}

            ### vcpkg Port Information
            To use this release with custom vcpkg registries or overlay ports:
            ```cmake
            # portfile.cmake
            vcpkg_from_github(
                OUT_SOURCE_PATH SOURCE_PATH
                REPO ${{ github.repository }}
                REF "${{ needs.validate-tag.outputs.tag }}"
                HEAD_REF main
            )
            ```
